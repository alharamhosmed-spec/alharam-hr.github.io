<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>نظام التحضير والانصراف – مستشفى الحرم</title>

  <link rel="icon" href="https://i.postimg.cc/R0qk6xCj/thdyry.png">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/R0qk6xCj/thdyry.png">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0053b3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="التحضير">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0b0c10;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    }
    #appFrame {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none; background: #0b0c10;
    }
    #loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0b0c10; color: #a0cfff;
      z-index: 10; transition: opacity .4s;
    }
    #loader img { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 18px; }
    #loader .title { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 6px; }
    #loader .sub { font-size: 13px; color: #7f92b0; margin-bottom: 20px; }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid rgba(74,163,255,.25);
      border-top-color: #4aa3ff; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <div id="loader">
    <img src="https://i.postimg.cc/R0qk6xCj/thdyry.png" alt="icon">
    <div class="title">نظام الحضور والانصراف</div>
    <div class="sub">مستشفى الحرم — جارٍ التحميل...</div>
    <div class="spinner"></div>
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwIQv0fBhiuZCgufdKCC5zFjppEbm-Od7wnO18YjUGBLArjFwUYdpAQf3HTkcTaLvAg/exec"
    allow="geolocation *; camera *; microphone *; clipboard-read; clipboard-write; fullscreen"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <script>
    var frame = document.getElementById('appFrame');
    var loader = document.getElementById('loader');
    frame.addEventListener('load', function () {
      setTimeout(function () { loader.classList.add('hidden'); }, 600);
    });
    setTimeout(function () { loader.classList.add('hidden'); }, 8000);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
